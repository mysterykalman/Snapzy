name: Debug BrowserBridge Crash
# re-run marker: verifying nonisolated-deinit fix

# TEMPORARY diagnostic workflow. Runs ONLY BrowserBridgeCoordinatorTests
# (which crash the CI runner's hosted test process -- see
# SnapzyTests/Services/BrowserBridge/BrowserBridgeCoordinatorTests.swift)
# and gathers forensic evidence this environment cannot gather locally
# (no local Xcode/lldb/otool): binary linkage type for BrowserBridgeKit,
# whether it's duplicated between the app and test bundle, and the full
# symbolicated macOS crash report. Delete this file once the crash is
# root-caused.

on:
  push:
    branches: [capture/integration]
    paths:
      - '.github/workflows/debug-bridge-crash.yml'
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Record start time
        run: date -u +%s > /tmp/start_epoch.txt

      - name: Run only BrowserBridgeCoordinatorTests
        run: |
          mkdir -p build
          xcodebuild \
            -project Snapzy.xcodeproj \
            -scheme Snapzy \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/debug-test.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:SnapzyTests/BrowserBridgeCoordinatorTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test > build/debug-test.log 2>&1 || true
          echo "=== tail of test log ==="
          tail -150 build/debug-test.log

      - name: Inspect BrowserBridgeKit build products (static vs dynamic, duplication)
        run: |
          echo "=== Searching DerivedData for BrowserBridgeKit artifacts ==="
          find build/DerivedData -iname "*BrowserBridgeKit*" 2>/dev/null | sort

          echo ""
          echo "=== file(1) on each ==="
          find build/DerivedData -iname "*BrowserBridgeKit*" -type f 2>/dev/null | while read -r f; do
            echo "--- $f ---"
            file "$f" || true
          done

          echo ""
          echo "=== Snapzy app binary: otool -L (filtered) ==="
          APP_BIN=$(find build/DerivedData -path "*Products/Debug/Snapzy*.app/Contents/MacOS/Snapzy" | head -1)
          echo "app binary: $APP_BIN"
          if [ -n "$APP_BIN" ]; then otool -L "$APP_BIN" | grep -i bridge || echo "(no Bridge-linked dylibs)"; fi

          echo ""
          echo "=== SnapzyTests binary: otool -L (filtered) ==="
          TEST_BIN=$(find build/DerivedData -path "*Products/Debug/SnapzyTests.xctest/Contents/MacOS/SnapzyTests" | head -1)
          echo "test binary: $TEST_BIN"
          if [ -n "$TEST_BIN" ]; then otool -L "$TEST_BIN" | grep -i bridge || echo "(no Bridge-linked dylibs)"; fi

          echo ""
          echo "=== Does the app embed a BrowserBridgeKit.framework? ==="
          find build/DerivedData -path "*Snapzy*.app/Contents/Frameworks*" -iname "*bridge*" 2>/dev/null

          echo ""
          echo "=== Does the test bundle embed its own BrowserBridgeKit.framework? ==="
          find build/DerivedData -path "*SnapzyTests.xctest*" -iname "*bridge*" 2>/dev/null

          echo ""
          echo "=== nm: does BrowserBridgeKit's Swift metadata symbol appear in BOTH binaries? ==="
          if [ -n "$APP_BIN" ]; then
            echo "--- app binary symbol count for BrowserBridgeKit ---"
            nm "$APP_BIN" 2>/dev/null | grep -c "BrowserBridgeKit" || true
          fi
          if [ -n "$TEST_BIN" ]; then
            echo "--- test binary symbol count for BrowserBridgeKit ---"
            nm "$TEST_BIN" 2>/dev/null | grep -c "BrowserBridgeKit" || true
          fi
        continue-on-error: true

      - name: Collect real crash reports (symbolicated)
        run: |
          START=$(cat /tmp/start_epoch.txt)
          echo "=== Searching ~/Library/Logs/DiagnosticReports for Snapzy crashes since $START ==="
          FOUND=0
          for f in ~/Library/Logs/DiagnosticReports/Snapzy*.ips ~/Library/Logs/DiagnosticReports/Snapzy*.crash; do
            [ -e "$f" ] || continue
            MTIME=$(stat -f %m "$f" 2>/dev/null || echo 0)
            if [ "$MTIME" -ge "$START" ]; then
              FOUND=1
              echo ""
              echo "########## $f ##########"
              cat "$f"
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No fresh Snapzy crash report found in DiagnosticReports (checking DerivedData's own Logs too)"
            find build/DerivedData -iname "*.crash" -o -iname "*.ips" 2>/dev/null
          fi
        continue-on-error: true

      - name: Extract crash/failure detail from xcresult
        run: |
          echo "=== xcresulttool get (test results summary) ==="
          xcrun xcresulttool get --legacy --format json --path build/debug-test.xcresult > /tmp/xcresult.json 2>&1 || echo "xcresulttool failed"
          echo "--- grep for crash/signal/exception mentions ---"
          grep -io '"crash[^"]*"\|signal[^,}]*\|exception[^,}]*\|"message" *: *"[^"]*"' /tmp/xcresult.json | sort -u | head -100 || true
        continue-on-error: true

      - name: Upload full diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bridge-crash-debug
          path: |
            build/debug-test.log
            build/debug-test.xcresult
            /tmp/xcresult.json
