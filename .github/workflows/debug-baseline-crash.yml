name: Debug Baseline Store Crash

# TEMPORARY diagnostic workflow. Runs only BaselineStoreTests (which
# crash the CI runner's hosted test process -- see
# SnapzyTests/Services/Diff/BaselineStoreTests.swift) and gathers the
# full symbolicated macOS crash report this environment cannot gather
# locally (no Xcode/lldb here). Delete this file once the crash is
# root-caused.

on:
  push:
    branches: [capture/integration]
    paths:
      - '.github/workflows/debug-baseline-crash.yml'
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Record start time
        run: date -u +%s > /tmp/start_epoch.txt

      - name: Run only BaselineStoreTests
        run: |
          mkdir -p build
          xcodebuild \
            -project Snapzy.xcodeproj \
            -scheme Snapzy \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/debug-test.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:SnapzyTests/BaselineStoreTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test > build/debug-test.log 2>&1 || true
          echo "=== tail of test log ==="
          tail -150 build/debug-test.log

      - name: Collect real crash reports (symbolicated)
        run: |
          START=$(cat /tmp/start_epoch.txt)
          echo "=== Searching ~/Library/Logs/DiagnosticReports for Snapzy crashes since $START ==="
          FOUND=0
          for f in ~/Library/Logs/DiagnosticReports/Snapzy*.ips ~/Library/Logs/DiagnosticReports/Snapzy*.crash; do
            [ -e "$f" ] || continue
            MTIME=$(stat -f %m "$f" 2>/dev/null || echo 0)
            if [ "$MTIME" -ge "$START" ]; then
              FOUND=1
              echo ""
              echo "########## $f ##########"
              cat "$f"
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No fresh Snapzy crash report found in DiagnosticReports"
          fi
        continue-on-error: true

      - name: Upload full diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-crash-debug
          path: |
            build/debug-test.log
            build/debug-test.xcresult
