name: Dev Artifact Build

# Personal-testing build pipeline: builds Capture/Snapzy on a macOS runner and
# uploads the .app as a downloadable workflow artifact, so changes can be
# tested without a local Xcode install. Ad-hoc signed only — not for
# distribution. See docs/BUILD.md and docs/REFERENCE_PROVENANCE.md.

on:
  push:
    branches: [capture/integration]
  workflow_dispatch: {}

concurrency:
  group: dev-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Build (Release, ad-hoc signed)
        run: |
          set -euo pipefail
          mkdir -p build

          if ! xcodebuild \
            -project Snapzy.xcodeproj \
            -scheme Snapzy \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build > build/dev-build.log 2>&1; then
            tail -200 build/dev-build.log
            exit 1
          fi

          tail -20 build/dev-build.log

      - name: Build native host (universal)
        run: |
          set -euo pipefail
          swift build --package-path native-host -c release --arch arm64 --arch x86_64 --product snapzy-native-host
          HOST_BIN_DIR="$(swift build --package-path native-host -c release --arch arm64 --arch x86_64 --show-bin-path)"
          APP_PATH="build/DerivedData/Build/Products/Release/Snapzy.app"
          mkdir -p "$APP_PATH/Contents/Helpers" "$APP_PATH/Contents/Resources/BrowserBridge"
          cp "$HOST_BIN_DIR/snapzy-native-host" "$APP_PATH/Contents/Helpers/"
          ditto extensions/chromium/src "$APP_PATH/Contents/Resources/BrowserBridge/chromium/src"
          cp extensions/chromium/manifest.json "$APP_PATH/Contents/Resources/BrowserBridge/chromium/"
          cp scripts/install-native-host.sh "$APP_PATH/Contents/Resources/BrowserBridge/"
          codesign --force --sign - "$APP_PATH/Contents/Helpers/snapzy-native-host"
          # Adding resources changes the app seal; renew it after embedding.
          codesign --force --sign - "$APP_PATH"

      - name: Inspect and archive app
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/Snapzy.app"
          python3 scripts/verify-app-bundle.py "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          mkdir -p build/dist
          ditto "$APP_PATH" build/dist/Capture.app
          # Archive before upload: upload-artifact does not preserve executable modes.
          ditto -c -k --sequesterRsrc --keepParent build/dist/Capture.app build/dist/Capture-dev.zip
          mkdir -p build/archive-check
          ditto -x -k build/dist/Capture-dev.zip build/archive-check
          python3 scripts/verify-app-bundle.py build/archive-check/Capture.app
          codesign --verify --deep --strict build/archive-check/Capture.app

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Capture-dev-${{ github.sha }}
          path: build/dist/Capture-dev.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dev-build-log-${{ github.sha }}
          path: build/dev-build.log
